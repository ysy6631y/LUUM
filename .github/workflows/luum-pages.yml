name: Deploy LUUM experience to GitHub Pages

on:
  push:
    branches: [main, development/interactive-brand]
    paths:
      - 'experience/**'
      - '.github/workflows/luum-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experience/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: experience
      - name: Build site
        run: npm run build
        working-directory: experience
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/experience
          cp index.html _site/index.html
          cp -R experience/dist/. _site/experience/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
